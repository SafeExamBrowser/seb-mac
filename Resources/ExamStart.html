<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Safe Exam Browser</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: #f5f5f7; color: #1d1d1f;
  }
  main { width: min(560px, 88vw); }
  h1 { font-size: 28px; font-weight: 600; margin: 0 0 4px; }
  p { margin: 0 0 20px; color: #6e6e73; }
  form { display: flex; gap: 8px; margin-bottom: 20px; }
  input[type=text] {
    flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #c7c7cc; background: #fff; color: inherit;
  }
  input[type=text]:focus { outline: 2px solid #0a84ff; outline-offset: -1px; border-color: transparent; }
  button {
    font: inherit; font-weight: 500; padding: 10px 18px; border: 0; border-radius: 8px;
    background: #0a84ff; color: #fff; cursor: pointer;
  }
  button:hover { background: #0071e3; }
  ul { margin: 0; padding-left: 20px; color: #6e6e73; font-size: 14px; }
  li { margin-bottom: 4px; }
  kbd { font: 12px ui-monospace, Menlo, monospace; border: 1px solid #c7c7cc; border-radius: 4px; padding: 1px 5px; }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1c1e; color: #f5f5f7; }
    p, ul { color: #98989d; }
    input[type=text] { background: #2c2c2e; border-color: #48484a; }
    kbd { border-color: #48484a; }
  }
</style>
</head>
<body>
<main>
  <h1>Safe Exam Browser</h1>
  <p>Paste your exam link to begin.</p>
  <form id="start">
    <input id="link" type="text" autofocus autocomplete="off" autocapitalize="off" spellcheck="false"
           placeholder="https://exam.example.edu/…   or   seb://…">
    <button type="submit">Start exam</button>
  </form>
  <ul>
    <li>Any web address works, and so do <b>seb://</b> and <b>sebs://</b> links and links to a <b>.seb</b> file.</li>
    <li>Have a <b>.seb</b> file? Double-click it instead.</li>
    <li><kbd>⌘</kbd> <kbd>⇧</kbd> <kbd>L</kbd> locks and unlocks the browser. Copy and paste keep working.</li>
  </ul>
</main>
<script>
  document.getElementById('start').addEventListener('submit', function (event) {
    event.preventDefault();
    var link = document.getElementById('link').value.trim();
    if (link) {
      window.location.href = 'exambrowser://open?url=' + encodeURIComponent(link);
    }
  });
</script>
</body>
</html>
